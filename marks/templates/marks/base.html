<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mark Registration System{% endblock %}</title>

    <!-- Bootstrap CDN for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">

    <!-- Additional CSS for footer, animated background, button styles -->
    <style>
        /* Body styling with animated gradient background */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            background-size: 400% 400%;
            animation: gradient-animation 10s ease infinite;
            color: white;
        }

        /* Keyframes for background animation */
        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        main {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            color: black; /* Ensures content text is readable */
        }

        footer {
            position: relative; /* Keeps footer at the bottom without overlap */
        }

        /* Navbar Toggler */
        .navbar-toggler {
            border-radius: 50%; /* Circular shape */
            background-color: transparent;
            border: 2px solid white; /* White border */
            width: 50px;
            height: 50px;
            font-weight: bold;
            color: white;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Navbar toggler hover and click effects */
        .navbar-toggler:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .navbar-toggler:active {
            background-color: #6a11cb;
            color: #fff;
        }

        /* Navigation links styled as buttons */
        .nav-link {
            border: 2px solid white;
            border-radius: 20px;
            padding: 10px 20px;
            margin: 5px;
            transition: all 0.3s ease;
        }

        /* Navigation link hover effect */
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Navigation link click effect */
        .nav-link:active {
            background-color: #2575fc;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Header section -->
    <header class="bg-primary text-white text-center py-4">
        <h1>Mark Registration System</h1>
    </header>

    <!-- Navigation bar with centered links -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(45deg, #5422a9, #2575fc);">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                ☰
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'input_mark' %}">Input Marks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'update_mark' %}">Update Marks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'view_marks' %}">View Marks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'visualization' %}">Visualization</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content area -->
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer section -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2024 Mark Registration System. All rights reserved.</p>
    </footer>

    <!-- External JavaScript -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script>
        $(document).ready(function() {
            $('table').DataTable();
        });
    </script>
</body>
</html>
