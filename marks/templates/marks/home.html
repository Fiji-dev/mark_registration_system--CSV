{% extends 'marks/base.html' %}

{% block title %}Home - Mark Registration System{% endblock %}

{% block content %}
    <div class="container text-center my-5">
        <h3>Records</h3>
        <p>Total number of students: {{ num_students }}</p>
        <p>Total number of modules: {{ num_modules }}</p>

        <!-- Date and Time Section -->
        <div id="datetime" class="mt-5">
            <p id="current-date"></p>
            <p id="current-time"></p>
        </div>
    </div>

    <script>
        // Function to get the current date and time
        function updateDateTime() {
            const now = new Date();

            // Get the current date (Day, Month, Year)
            const day = now.getDate();
            const month = now.getMonth() + 1; // Months are 0-based
            const year = now.getFullYear();
            const formattedDate = `${day}/${month}/${year}`;

            // Get the current time (HH:MM:SS)
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // Format time to always have 2 digits
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            const formattedTime = `${hours}:${minutes}:${seconds}`;

            // Update the DOM with the current date and time
            document.getElementById("current-date").textContent = `Date: ${formattedDate}`;
            document.getElementById("current-time").textContent = `Time: ${formattedTime}`;
        }

        // Update the date and time when the page loads
        window.onload = updateDateTime;

        // Optionally, refresh the time every second
        setInterval(updateDateTime, 1000);
    </script>
{% endblock %}
